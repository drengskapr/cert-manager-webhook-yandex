image:
  # -- Webhook image repository
  repository: ghcr.io/drengskapr/cert-manager-webhook-yandex
  # -- Image tag; empty renders .Chart.AppVersion
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Pull secrets for the webhook pod, e.g. [{name: regcred}]
imagePullSecrets: []

# -- Overrides the chart name in resource names and labels
nameOverride: ""
# -- Overrides the full resource name
fullnameOverride: ""

# -- API group served by the webhook; Issuers reference it as `webhook.groupName`
groupName: acme.cloud.yandex.com

customCloudApi:
  # -- Render the API_ENDPOINT env var
  enabled: false
  # -- Yandex Cloud API endpoint
  endpoint: api.cloud.yandex.net:443

logging:
  # -- Log format: json-rfc3339 (RFC3339Nano `ts`), json (epoch-millis `ts`) or text
  format: json-rfc3339
  # -- Render --v=<verbosity>
  debug: false
  # -- Verbosity level, applied only when debug is true
  verbosity: 1

certManager:
  # -- Namespace of the cert-manager installation
  namespace: cert-manager
  # -- ServiceAccount of the cert-manager controller
  serviceAccountName: cert-manager

# -- Webhook pod replicas
replicaCount: 1

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 443

# -- Port the webhook container listens on
containerPort: 6443

# -- Webhook container resources
resources: {}

# -- Pod security context; numeric IDs are required because the image's user is non-numeric (nonroot)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Node selector for the webhook pod
nodeSelector: {}
# -- Tolerations for the webhook pod
tolerations: []
# -- Affinity for the webhook pod
affinity: {}
